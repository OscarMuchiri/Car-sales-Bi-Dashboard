name: Finalize Power BI report

on:
  push:
    branches: ["main"]
    paths:
      - "tools/finalize_powerbi.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply final Power BI report updates
        run: python tools/finalize_powerbi.py

      - name: Commit finalized PBIX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car_sales_dashboard.pbix
          if git diff --cached --quiet; then
            echo "No PBIX changes to commit."
          else
            git commit -m "Update final Power BI dashboard"
            git push
          fi
